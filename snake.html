<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
  }
  .game-wrapper {
    text-align: center;
  }
  canvas {
    border: 2px solid #e94560;
    background: #16213e;
    display: block;
  }
  .score {
    color: #fff;
    font-size: 20px;
    margin-bottom: 10px;
  }
  .game-over {
    color: #e94560;
    font-size: 18px;
    margin-top: 10px;
    height: 24px;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="score">分数: <span id="score">0</span></div>
  <canvas id="game" width="300" height="300"></canvas>
  <div class="game-over" id="status"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const statusEl = document.getElementById('status');

const SIZE = 15;       // 15x15 网格
const CELL = 20;       // 每格 20px
const TICK = 150;      // 毫秒

let snake, food, dir, nextDir, score, gameOver, timer;

function init() {
  const mid = Math.floor(SIZE / 2);
  snake = [{x: mid, y: mid}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  statusEl.textContent = '';
  scoreEl.textContent = '0';
  spawnFood();
  clearInterval(timer);
  timer = setInterval(tick, TICK);
}

function spawnFood() {
  const occupied = new Set(snake.map(p => `${p.x},${p.y}`));
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * SIZE),
      y: Math.floor(Math.random() * SIZE)
    };
  } while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
}

function tick() {
  if (gameOver) return;
  dir = {...nextDir};

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
    endGame();
    return;
  }

  // 撞自身
  for (const seg of snake) {
    if (seg.x === head.x && seg.y === head.y) {
      endGame();
      return;
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  gameOver = true;
  statusEl.textContent = '游戏结束！按空格键重新开始';
  clearInterval(timer);
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 网格线
  ctx.strokeStyle = '#1a2744';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, SIZE * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(SIZE * CELL, i * CELL);
    ctx.stroke();
  }

  // 蛇
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#2ecc71';
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
  });

  // 食物
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);
}

document.addEventListener('keydown', (e) => {
  if (gameOver && e.key === ' ') {
    init();
    return;
  }
  const map = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  const d = map[e.key];
  if (d && (d.x !== -dir.x || d.y !== -dir.y)) {
    e.preventDefault();
    nextDir = d;
  }
});

// WASD 支持
document.addEventListener('keydown', (e) => {
  const map = {
    w: {x: 0, y: -1},
    W: {x: 0, y: -1},
    s: {x: 0, y: 1},
    S: {x: 0, y: 1},
    a: {x: -1, y: 0},
    A: {x: -1, y: 0},
    d: {x: 1, y: 0},
    D: {x: 1, y: 0}
  };
  const d = map[e.key];
  if (d && (d.x !== -dir.x || d.y !== -dir.y)) {
    e.preventDefault();
    nextDir = d;
  }
});

init();
draw();
</script>
</body>
</html>
